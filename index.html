<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprendimiento </title>
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header>
        <h1>Estetica Cotidiana</h1>
    </header>
    <main>
        <section class="hero">
            <h2>Bienvenido a nuestro sitio web</h2>
            <p>Descubre nuestros productos y servicios.</p>
        </section>
        <section class="products">
            <h2>Productos Destacados</h2>
            <div class="product-list">
                <div class="product-item">
                    <img src="./assets/images/product1.jpg" alt="Producto 1">
                    <h3>Producto 1</h3>
                    <p>Descripción del producto 1.</p>
                </div>
                <div class="product-item">
                    <img src="./assets/images/product2.jpg" alt="Producto 2">
                    <h3>Producto 2</h3>
                    <p>Descripción del producto 2.</p>
                </div>
                <!-- Agrega más productos según sea necesario -->
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Emprendimiento. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
